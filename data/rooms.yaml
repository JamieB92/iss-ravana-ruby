# USCSS Nostromo - Room Map

cryo_bay:
  description: "Rows of cryo tubes line the walls, frost still clinging to the glass. Yours is the only one open."
  room_puzzle:
    - "The tube behind you hisses shut. Frost fog clears from a rack of black steel."
    - "PULSE RIFLE -- SECURED. IDENTITY VERIFICATION REQUIRED."
    - "A cracked terminal beside the rack still glows: CREW ROSTER -- CIPHER LOCK: SHIFT 3."
    - "Names run down the screen, every letter shifted, meaningless at a glance."
    - "Whoever set this lock trusted only the crew to read it. You are still crew."
    - "Decode your own name from the roster to prove it."
  exits:
    east: hypersleep_corridor
  item: pulse_rifle


hypersleep_corridor:
  description: "A long, dimly lit corridor connecting the cryo bay to the rest of the ship. Something has scratched the walls."
  exits:
    west: cryo_bay
    east: mess_hall
    north: cargo_hold
    south: maintenance_tunnels
  item: ~


cargo_hold:
  description: "Massive cargo containers are stacked to the ceiling. Several have been torn open from the inside."
  room_puzzle:
    - "Crates rise floor to ceiling, numbered in stencil paint. Twelve in total."
    - "Most sit torn open from the inside -- claws through steel, not tools."
    - "Three manifest scraps lie scattered nearby, torn and grease-stained."
    - "Each one crosses out a set of numbers. Cross-reference all three."
    - "One crate is left unaccounted for. That is the one nothing got to."
  exits:
    south: hypersleep_corridor
    east: weapons_locker
    west: storage_bay
  item: welding_torch


weapons_locker:
  description: "A reinforced room with empty weapon racks. Most of the gear is gone — but not all."
  room_puzzle:
    - "Empty racks line the walls -- picked clean, all but one cabinet."
    - "A keypad blinks beside a reinforced cabinet: 3-DIGIT CODE REQUIRED."
    - "No note. No manifest. Just three etched marks worn faint beside the keys."
    - "Whatever the code is, it is not written here -- you have already seen it."
    - "Somewhere behind you, in rooms already crossed."
  exits:
    west: cargo_hold
  item: flamethrower


storage_bay:
  description: "Shelving units line the walls, mostly stripped bare. A few unopened crates remain, still sealed with quarantine tape."
  exits:
    east: cargo_hold
    west: crew_quarters
  item: ~


crew_quarters:
  description: "Personal effects are scattered across the bunks — photos, half-written letters, a life left mid-sentence."
  exits:
    east: storage_bay
    north: mess_hall
  item: ~


mess_hall:
  description: "Trays of cold food still sit on the tables. A chair has been knocked over. Nobody finished their meal."
  room_puzzle:
    - "Trays sit cold and untouched. A chair lies knocked over on its side."
    - "MED KIT -- LOCKER STORAGE, CREW ASSIGNED."
    - "Placecards, half-burnt, still mark where each crew member sat."
    - "Work out who was sitting where, and whose locker that leaves you."
  exits:
    west: hypersleep_corridor
    east: server_room
    north: armory
    south: crew_quarters
  item: med_kit


armory:
  description: "Emergency weapons storage. The motion sensors on the wall are still blinking."
  room_puzzle:
    - "Motion sensors blink along the wall, patient, still watching."
    - "MOTION TRACKER -- CASING SEALED, CALIBRATION REQUIRED."
    - "The blinking follows a pattern: short, short, long, short."
    - "Match it -- move the same rhythm through the room -- and the casing unlocks."
  exits:
    south: mess_hall
  item: motion_tracker


server_room:
  description: "Banks of humming terminals fill the room. MU/TH/UR's interface glows faintly on one screen."
  exits:
    west: mess_hall
    east: comms_array
  item: ~


comms_array:
  description: "A tangle of antenna equipment and radio gear. Static hisses from every speaker."
  exits:
    west: server_room
    north: observation_deck
  item: comms_device


observation_deck:
  description: "A domed viewport looks out into the void. You can see the planet below — and something moving on the hull."
  exits:
    south: comms_array
  item: ~


maintenance_tunnels:
  description: "A cramped network of crawl spaces running beneath the ship. The air is hot and smells of copper."
  room_puzzle:
    - "Crawlspaces branch off in every direction, cramped and reeking of copper."
    - "HAZMAT SUIT -- VISIBLE THROUGH A GRATE, PAST THE TUNNELS."
    - "Each route hisses or glows differently as you approach."
    - "Pick wrong and something in the pipes will not forgive you."
  exits:
    north: hypersleep_corridor
    east: engine_room
    south: quarantine_zone
  item: hazmat_suit

engine_room:
  description: "The ship's massive drives throb and shake the floor. Oil and acid have burned black marks into everything."
  exits:
    west: maintenance_tunnels
    north: research_lab
    south: captains_quarters
  item: ~

research_lab:
  description: "Specimen jars and broken equipment litter the benches. Someone was studying something they shouldn't have."
  room_puzzle:
    - "Specimen jars line the benches, most shattered, one label mostly intact."
    - "ACCESS KEYCARD -- SEALED, CLEARANCE REQUIRED."
    - "Half the letters are blacked out on the label, redacted by someone in a hurry."
    - "What is left still spells something, if you read it in order."
  exits:
    south: engine_room
  item: access_keycard


quarantine_zone:
  description: "Red warning lights pulse slowly. The containment doors have been forced open from the inside."
  exits:
    north: maintenance_tunnels
  item: ~

captains_quarters:
  description: "The captain's log is still open on the desk. The last entry is just one word: 'Run.'"
  room_puzzle:
    - "The captain's log sits open on the desk, screen still lit."
    - "DETONATOR -- ARMED, SEQUENCE CODE REQUIRED."
    - "More entries are scattered around the room, torn from a private terminal."
    - "Read out of order they say nothing. In the right order, they arm the code."
  exits:
    north: engine_room
    east: air_lock
  item: detonator


air_lock:
  description: "A heavy blast door leads to the outer hull. A smaller door leads forward to the bridge."
  exits:
    west: captains_quarters
    east: bridge
  item: ~


bridge:
  description: "The command centre of the ship. Every screen shows the same thing — a biosign, moving toward you."
  exits:
    west: air_lock
    north: escape_bay
  item: ~


escape_bay:
  description: "The last escape pod sits in its launch cradle. Something enormous is coiled around it, waiting."
  exits:
    south: bridge
  item: stasis_pod_code  # dropped by Xenomorph Queen on defeat